[package]
name = "pgmold-operator"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pgmold = { path = ".." }
kube = { version = "5.2", features = ["runtime"] }
k8s-openapi = { version = "0.29", features = ["v1_33"] }
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
